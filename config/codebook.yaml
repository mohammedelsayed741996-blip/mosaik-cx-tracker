  - {name: c3_r2, raw: C3r2, label: "Satisfaction: transfer speed", type: int, values: sat5_dk, base: mosaik_cust}
  - {name: c3_r3, raw: C3r3, label: "Satisfaction: fees / value for money", type: int, values: sat5_dk, base: mosaik_cust}
  - {name: c3_r4, raw: C3r4, label: "Satisfaction: customer service", type: int, values: sat5_dk, base: mosaik_cust}
